{% extends "base.html" %}
    {% block styles %}
        <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='leaderboard.css') }}" />
    {% endblock %}
{% block main_content %}
            <section>
                <table>
                        <thead>
                            <tr>
                                <th>Placement</th>
                                <th>User</th>
                                <th>Score</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                    {% for user in leaderboard %}
                    <tr>
                        <td>#{{ loop.index }}</td>
                        <td>{{ user["user"] }}</td>
                        <td>{{ user["score"] }}</td>
                        <td>{{ user["time"] }}</td>
                    </tr>
                    {% endfor %}
                </table>
            </section>
        
    <p><a href="{{url_for('index')}}">Main Menu</a></p>

{% endblock %}
